<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨后天晴</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .transition-all-custom {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.7);
        }
        
        .timeline-dot {
            transition: transform 0.2s ease, width 0.2s ease, height 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .timeline-hover-tooltip {
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px) scale(0.92);
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .timeline-node-container:hover .timeline-hover-tooltip {
            pointer-events: auto;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .svg-conn-line {
            opacity: 0 !important;
            visibility: hidden !important;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        
        .svg-conn-line path {
            stroke: #6366f1;
            stroke-width: 2.5px;
            stroke-dasharray: 6 4;
            transition: stroke 0.2s ease, stroke-width 0.2s ease;
        }

        .svg-conn-line polygon {
            fill: #4f46e5;
            transition: fill 0.2s ease, transform 0.2s ease;
        }
        
        .svg-conn-line.active-line {
            opacity: 1 !important;
            visibility: visible !important;
            filter: drop-shadow(0 2px 4px rgba(79, 70, 229, 0.35));
        }

        .svg-conn-line.active-line path {
            stroke: #4f46e5 !important;
            stroke-width: 3px !important;
        }

        .timeline-node-container:hover .timeline-dot {
            transform: scale(1.3);
            box-shadow: 0 0 0 6px rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans flex flex-col antialiased">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-sm">
                    <i class="fa-solid fa-cloud-sun text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl text-slate-900 tracking-wide">雨后天晴</h1>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <div id="syncStatus" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs bg-slate-100 text-slate-500 font-medium">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="syncDot"></span>
                    <span id="syncText">正在同步...</span>
                </div>

                <button onclick="openTagModal()" class="px-3 py-2 rounded-lg text-xs font-medium border border-slate-300 hover:bg-slate-50 text-slate-700 flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-tags text-slate-500"></i>
                    <span>tag库</span>
                </button>

                <button onclick="openShareModal()" class="px-3 py-2 rounded-lg text-xs font-medium border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 flex items-center gap-1.5 transition-all shadow-sm">
                    <i class="fa-solid fa-share-nodes text-indigo-600"></i>
                    <span>分享协同</span>
                </button>

                <button id="lockToggleBtn" onclick="toggleLockState()" class="flex items-center gap-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all shadow-sm border">
                    <!-- Dynamic Content in JS -->
                </button>

                <button id="addEventBtn" onclick="handleNewEventClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium flex items-center gap-2 shadow-sm transition-all">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">新建事件</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
        <!-- Toast Box -->
        <div id="toastBox" class="hidden fixed top-20 right-4 z-[9999] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center gap-3 transition-all duration-300 transform translate-y-0 opacity-100">
            <i id="toastIcon" class="fa-solid fa-circle-info text-indigo-400 text-lg"></i>
            <span id="toastText" class="text-sm font-medium">提示信息</span>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 bg-white p-3 sm:p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                <button id="viewTimelineBtn" onclick="switchView('timeline')" class="px-3.5 py-1.5 rounded-md text-xs font-semibold flex items-center gap-2 transition-all bg-white text-indigo-600 shadow-sm">
                    <i class="fa-solid fa-timeline"></i>
                    <span>时间线视角</span>
                </button>
                <button id="viewGridBtn" onclick="switchView('grid')" class="px-3.5 py-1.5 rounded-md text-xs font-semibold flex items-center gap-2 transition-all text-slate-600 hover:text-slate-900">
                    <i class="fa-solid fa-border-all"></i>
                    <span>卡片视图</span>
                </button>
            </div>

            <div id="zoomControlContainer" class="flex items-center gap-2 border-x border-slate-200 px-4 py-1">
                <span class="text-xs text-slate-500 font-medium flex items-center gap-1">
                    <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                    <span>时间线密度:</span>
                </span>
                <button onclick="changeZoom(-1)" title="缩小密度" class="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-xs transition-colors font-bold">-</button>
                <input type="range" id="zoomSlider" min="1" max="5" value="3" oninput="setZoom(this.value)" class="w-20 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                <button onclick="changeZoom(1)" title="放大密度" class="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-xs transition-colors font-bold">+</button>
            </div>

            <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg text-xs w-full sm:w-auto">
                <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜索事件或tag..." class="bg-transparent outline-none text-slate-700 placeholder-slate-400 w-full sm:w-48">
            </div>
        </div>

        <div id="timelineWrapper" class="relative group my-8 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm overflow-hidden">
            <div class="text-xs text-slate-400 mb-2 flex items-center justify-between">
                <span><i class="fa-solid fa-circle-info text-indigo-500 mr-1"></i>悬停节点或卡片显示思维导图虚线</span>
                <span id="densityLabel" class="font-mono text-indigo-600 font-semibold">密度: 标准</span>
            </div>

            <button onclick="scrollTimeline(-300)" class="hidden md:flex absolute left-2 top-1/2 -translate-y-1/2 z-20 bg-white/95 hover:bg-white shadow-lg rounded-full w-9 h-9 border border-slate-200 items-center justify-center text-slate-700 hover:text-indigo-600 transition-all">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <button onclick="scrollTimeline(300)" class="hidden md:flex absolute right-2 top-1/2 -translate-y-1/2 z-20 bg-white/95 hover:bg-white shadow-lg rounded-full w-9 h-9 border border-slate-200 items-center justify-center text-slate-700 hover:text-indigo-600 transition-all">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>

            <div id="timelineContainer" onscroll="renderSvgConnections()" onwheel="handleTimelineWheel(event)" class="overflow-x-auto pt-36 pb-20 px-12 flex items-center relative min-h-[460px] custom-scrollbar scroll-smooth">
                <svg id="timelineSvgOverlay" class="absolute top-0 left-0 pointer-events-none z-0">
                    <g id="svgConnectionsGroup"></g>
                </svg>
                <div id="timelineMainAxis" class="absolute left-0 right-0 h-1 bg-slate-300 rounded-full z-0 transition-all"></div>
                <div id="timelineNodesTrack" class="flex items-end w-full relative z-10 min-w-full"></div>
            </div>
        </div>

        <div id="eventGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-16 h-16 bg-slate-200 text-slate-400 rounded-full flex items-center justify-center text-2xl mb-4">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-700">暂无事件</h3>
            <p class="text-slate-500 text-xs mt-1 max-w-md">点击右上角的“新建事件”开始记录。</p>
        </div>
    </main>

    <!-- Tag Manager Modal -->
    <div id="tagModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-tags text-indigo-600"></i>
                    <span>tag库</span>
                </h3>
                <button onclick="closeTagModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="tagInputContainer" class="flex gap-2 mb-4">
                <input type="text" id="newTagInput" placeholder="输入新tag名称" class="flex-grow px-3 py-2 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addNewTagFromModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-medium">新建tag</button>
            </div>
            <div id="tagModalList" class="flex flex-wrap gap-2 max-h-60 overflow-y-auto p-1"></div>
        </div>
    </div>

    <!-- Share Collaboration Modal -->
    <div id="shareModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-600"></i>
                    <span>多端实时协同分享</span>
                </h3>
                <button onclick="closeShareModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="bg-indigo-50/60 border border-indigo-100 rounded-xl p-3.5 mb-4 text-xs text-slate-600 space-y-2">
                <div class="font-bold text-indigo-900 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info text-indigo-600"></i>
                    <span>协同使用说明</span>
                </div>
                <ul class="list-disc list-inside space-y-1.5 text-slate-600 leading-relaxed">
                    <li><span class="font-semibold text-slate-800">多端同步：</span>复制专属链接发送给好友即可加入。</li>
                    <li><span class="font-semibold text-slate-800">实时协作：</span>任何人在空间内操作均会实时同步。</li>
                </ul>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-700 mb-1">当前空间 ID (Room)</label>
                <div class="flex gap-2">
                    <input type="text" id="shareRoomInput" placeholder="公共空间 (default)" class="flex-grow px-3 py-2 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="switchRoomFromInput()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-xs font-medium shrink-0">切换/创建空间</button>
                </div>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-4">
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">协同分享专用链接</label>
                <div class="flex items-center gap-2">
                    <input type="text" id="shareUrlInput" readonly class="flex-grow bg-white px-2.5 py-1.5 border border-slate-200 rounded-md text-xs font-mono text-slate-700 select-all outline-none">
                    <button onclick="copyShareLink()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-xs font-medium shrink-0 flex items-center gap-1">
                        <i class="fa-solid fa-copy"></i>
                        <span>复制链接</span>
                    </button>
                </div>
            </div>

            <div class="flex justify-end">
                <button onclick="closeShareModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-medium text-slate-700">关闭</button>
            </div>
        </div>
    </div>

    <!-- Unlock Password Modal -->
    <div id="pwdModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-lock text-amber-500"></i>
                    <span>解锁编辑权限</span>
                </h3>
                <button onclick="closePwdModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 mb-3">请输入管理密码解锁修改与编辑权限：</p>
            <input type="password" id="unlockPwdInput" placeholder="输入解锁密码" onkeydown="if(event.key==='Enter') submitUnlockPassword()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="closePwdModal()" class="px-4 py-2 border border-slate-300 hover:bg-slate-100 rounded-lg text-xs font-medium text-slate-700">取消</button>
                <button onclick="submitUnlockPassword()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium shadow-sm">解锁</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/75 backdrop-blur-md z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center transform scale-100 transition-transform">
            <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-base mb-1">确认删除事件？</h3>
            <p class="text-xs text-slate-500 mb-5">删除后将无法恢复，关联的思维导图连线也将同步注销。</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeConfirmModal()" class="px-4 py-2 border border-slate-300 hover:bg-slate-100 rounded-lg text-xs font-medium text-slate-700">取消</button>
                <button onclick="confirmDeleteEvent()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-medium shadow-sm">确认删除</button>
            </div>
        </div>
    </div>

    <!-- Image Crop Modal -->
    <div id="cropModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[80] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl max-w-lg w-full p-6 text-white flex flex-col items-center">
            <div class="flex items-center justify-between w-full pb-3 border-b border-slate-800 mb-4">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-crop text-indigo-400"></i>
                    <span>截选图片显示区域</span>
                </h3>
                <button onclick="closeCropModal()" class="text-slate-400 hover:text-white w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-xs text-slate-400 mb-3 text-left w-full">请拖动或调整下方选框，截选您希望在预览中展示的关键部分：</p>
            
            <div id="cropContainer" class="relative max-h-[50vh] overflow-auto border border-slate-700 rounded-xl bg-black flex justify-center items-center my-2 select-none cursor-crosshair">
                <img id="cropTargetImg" class="max-w-full block pointer-events-none">
                <div id="cropBox" class="absolute border-2 border-indigo-400 bg-indigo-500/20 shadow-[0_0_0_9999px_rgba(0,0,0,0.6)] cursor-move">
                    <div class="absolute -top-1.5 -left-1.5 w-3 h-3 bg-white border border-indigo-600"></div>
                    <div class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-white border border-indigo-600"></div>
                    <div class="absolute -bottom-1.5 -left-1.5 w-3 h-3 bg-white border border-indigo-600"></div>
                    <div class="absolute -bottom-1.5 -right-1.5 w-3 h-3 bg-white border border-indigo-600"></div>
                </div>
            </div>

            <div class="flex justify-end gap-3 w-full mt-4 pt-3 border-t border-slate-800">
                <button onclick="closeCropModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-medium">取消</button>
                <button onclick="confirmCropImage()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium shadow-sm">完成截选</button>
            </div>
        </div>
    </div>

    <!-- Image Lightbox Modal for Fullscreen View -->
    <div id="lightboxModal" class="fixed inset-0 bg-slate-950/95 z-[90] hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <button class="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800/80 w-10 h-10 rounded-full flex items-center justify-center transition-colors z-10">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <img id="lightboxImg" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        window.currentRoomId = urlParams.get('room') || 'default';

        const baseAppId = typeof __app_id !== 'undefined' ? __app_id : 'yuhoutianqing-app';
        const appId = `${baseAppId}-${window.currentRoomId}`;

        const firebaseConfig = {
            apiKey: "AIzaSyC_E_OiW5o7ekAA04y_xNcBQ1_BZEtOBOM",
            authDomain: "yuhoutianqing-3d170.firebaseapp.com",
            databaseURL: "https://yuhoutianqing-3d170-default-rtdb.firebaseio.com",
            projectId: "yuhoutianqing-3d170",
            storageBucket: "yuhoutianqing-3d170.firebasestorage.app",
            messagingSenderId: "162241948953",
            appId: "1:162241948953:web:7d004f19089f4a17a1e988",
            measurementId: "G-QGEYCHBDDG"
        };

        let app = null;
        let auth = null;
        let db = null;

        if (firebaseConfig) {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } catch (err) {
                console.warn("Firebase initialization error:", err);
            }
        }

        window.events = [];
        window.connections = [];
        window.availableTags = [];
        
        window.isLocked = localStorage.getItem('yuhoutianqing_isLocked') === 'false' ? false : true;
        const LOCK_PASSWORD = "tingyu1938";
        window.currentView = 'timeline';
        window.zoomLevel = 3;
        window.activeHoverIntervals = {};
        window.editingImageFiles = [];
        window.pendingDeleteId = null;

        // Crop State
        let cropState = {
            index: -1,
            naturalWidth: 0,
            naturalHeight: 0,
            x: 0,
            y: 0,
            w: 100,
            h: 100,
            isDragging: false,
            startX: 0,
            startY: 0
        };

        let currentUser = null;
        let isInitialLoadDone = false;

        function loadLocalData() {
            try {
                const localEv = localStorage.getItem('yuhoutianqing_events');
                const localConn = localStorage.getItem('yuhoutianqing_connections');
                const localTags = localStorage.getItem('yuhoutianqing_tags');

                if (localEv) window.events = JSON.parse(localEv);
                if (localConn) window.connections = JSON.parse(localConn);
                if (localTags) window.availableTags = JSON.parse(localTags);
            } catch (e) {
                console.warn("localStorage 读取异常:", e);
            }
        }

        function saveLocalData() {
            try {
                localStorage.setItem('yuhoutianqing_events', JSON.stringify(window.events));
                localStorage.setItem('yuhoutianqing_connections', JSON.stringify(window.connections));
                localStorage.setItem('yuhoutianqing_tags', JSON.stringify(window.availableTags));
            } catch (e) {
                console.warn("localStorage 保存失败:", e);
            }
        }

        function initializeLocalFallback(reason = '已就绪 (本地)') {
            if (isInitialLoadDone) return;
            isInitialLoadDone = true;
            loadLocalData();
            window.renderEvents();
            updateSyncStatus('offline', reason);
        }

        async function initAppAndCloudSync() {
            window.updateLockButtonUI();

            const syncTimeout = setTimeout(() => {
                if (!isInitialLoadDone) {
                    initializeLocalFallback('已就绪 (本地)');
                }
            }, 2500);

            if (!firebaseConfig || !auth || !db) {
                clearTimeout(syncTimeout);
                initializeLocalFallback('已就绪 (本地)');
                return;
            }

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = userCred.user;
                } else {
                    const userCred = await signInAnonymously(auth);
                    currentUser = userCred.user;
                }
            } catch (err) {
                clearTimeout(syncTimeout);
                initializeLocalFallback('已就绪 (本地)');
                return;
            }

            if (currentUser) {
                setupRealtimeListeners(syncTimeout);
            } else {
                clearTimeout(syncTimeout);
                initializeLocalFallback('已就绪 (本地)');
            }
        }

        function updateSyncStatus(type, text) {
            const dot = document.getElementById('syncDot');
            const textEl = document.getElementById('syncText');
            if (!dot || !textEl) return;
            textEl.innerText = text;
            if (type === 'synced') {
                dot.className = "w-2 h-2 rounded-full bg-emerald-500";
            } else if (type === 'syncing') {
                dot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            } else if (type === 'offline') {
                dot.className = "w-2 h-2 rounded-full bg-indigo-500";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-rose-500";
            }
        }

        function setupRealtimeListeners(syncTimeout) {
            if (!currentUser || !db) return;

            try {
                const eventsCol = collection(db, 'artifacts', appId, 'public', 'data', 'events');
                const connCol = collection(db, 'artifacts', appId, 'public', 'data', 'connections');
                const tagsCol = collection(db, 'artifacts', appId, 'public', 'data', 'tags');

                onSnapshot(eventsCol, async (snapshot) => {
                    if (syncTimeout) clearTimeout(syncTimeout);
                    isInitialLoadDone = true;
                    window.events = snapshot.docs.map(doc => ({ id: isNaN(doc.id) ? doc.id : Number(doc.id), ...doc.data() }));
                    saveLocalData();
                    window.renderEvents();
                    updateSyncStatus('synced', '已同步云端');
                }, (error) => {
                    if (syncTimeout) clearTimeout(syncTimeout);
                    initializeLocalFallback('已就绪 (本地)');
                });

                onSnapshot(connCol, (snapshot) => {
                    window.connections = snapshot.docs.map(doc => ({ id: isNaN(doc.id) ? doc.id : Number(doc.id), ...doc.data() }));
                    saveLocalData();
                    window.renderSvgConnections();
                });

                onSnapshot(tagsCol, (snapshot) => {
                    if (!snapshot.empty) {
                        const loadedTags = snapshot.docs.map(doc => doc.data().name);
                        if (loadedTags.length >= 0) window.availableTags = loadedTags;
                    }
                    saveLocalData();
                    window.renderTagModalList();
                });
            } catch (err) {
                if (syncTimeout) clearTimeout(syncTimeout);
                initializeLocalFallback('已就绪 (本地)');
            }
        }

        window.saveEventToCloud = async function(eventData) {
            const index = window.events.findIndex(e => String(e.id) === String(eventData.id));
            if (index >= 0) {
                window.events[index] = eventData;
            } else {
                window.events.push(eventData);
            }
            saveLocalData();
            window.renderEvents();

            if (!currentUser || !db) return;
            try {
                updateSyncStatus('syncing', '保存中...');
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', String(eventData.id)), eventData);
                updateSyncStatus('synced', '已同步云端');
            } catch (e) {
                updateSyncStatus('offline', '已就绪 (本地)');
            }
        };

        window.deleteEventFromCloud = async function(eventId) {
            window.events = window.events.filter(e => String(e.id) !== String(eventId));
            window.connections = window.connections.filter(c => String(c.sourceId) !== String(eventId) && String(c.targetId) !== String(eventId));

            if (!currentUser || !db) return;
            try {
                updateSyncStatus('syncing', '删除中...');
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'events', String(eventId)));
                const toDeleteConns = window.connections.filter(c => String(c.sourceId) === String(eventId) || String(c.targetId) === String(eventId));
                for (const c of toDeleteConns) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'connections', String(c.id)));
                }
                updateSyncStatus('synced', '已同步云端');
            } catch (e) {
                updateSyncStatus('offline', '已就绪 (本地)');
            }
        };

        window.renderTimelineView = function(eventList = window.events) {
            const track = document.getElementById('timelineNodesTrack');
            if (!track) return;
            track.innerHTML = '';

            if (eventList.length === 0) {
                window.renderSvgConnections();
                return;
            }

            const scale = window.getZoomScale();
            const gapPx = Math.round(150 * scale);
            const dotMajorSize = Math.round(20 * scale);
            const dotMinorSize = Math.round(12 * scale);
            const fontSizeTitle = Math.max(10, Math.round(13 * scale));
            const previewWidth = Math.round(160 * Math.min(1.2, Math.max(0.7, scale)));
            const previewImgHeight = Math.round(100 * Math.min(1.2, Math.max(0.7, scale)));

            const sorted = [...eventList].sort((a, b) => new Date(a.date) - new Date(b.date));

            sorted.forEach((event) => {
                const isMajor = event.type === 'major';
                const dotSize = isMajor ? dotMajorSize : dotMinorSize;
                const nodeContainer = document.createElement('div');
                nodeContainer.className = "timeline-node-container relative flex flex-col items-center justify-end shrink-0 cursor-pointer group pb-6";
                nodeContainer.style.width = `${gapPx}px`;

                const hasImages = event.images && event.images.length > 0;
                // 支持解析预览图对象或直接字符串
                const firstImgObj = hasImages ? event.images[0] : null;
                const firstImgSrc = typeof firstImgObj === 'string' ? firstImgObj : (firstImgObj?.cropped || firstImgObj?.original);

                nodeContainer.innerHTML = `
                    ${hasImages ? `
                        <div class="timeline-hover-tooltip absolute bottom-full mb-3 z-30 bg-slate-900 rounded-xl border border-slate-700 overflow-hidden pointer-events-none" style="width: ${previewWidth}px; height: ${previewImgHeight}px;">
                            <img id="hover-img-${event.id}" src="${firstImgSrc}" class="w-full h-full object-cover transition-opacity duration-300">
                        </div>
                    ` : ''}

                    <div onclick="handleEventClick(${event.id})" class="text-center mb-4 max-w-[130px] select-none">
                        <span class="block font-medium ${isMajor ? 'text-indigo-900 font-bold' : 'text-slate-700'} line-clamp-1" style="font-size: ${fontSizeTitle}px;">
                            ${event.title}
                        </span>
                        <span class="block text-[10px] text-slate-400 font-mono mt-0.5">
                            ${event.date}
                        </span>
                    </div>

                    <div id="timeline-dot-${event.id}" onclick="handleEventClick(${event.id})" class="timeline-dot rounded-full bg-white border-2 ${isMajor ? 'border-indigo-600 bg-indigo-600 shadow-md ring-4 ring-indigo-100' : 'border-slate-400 hover:border-indigo-500 hover:bg-indigo-500'} flex items-center justify-center z-10 shrink-0" style="width: ${dotSize}px; height: ${dotSize}px;">
                    </div>
                `;

                nodeContainer.addEventListener('mouseenter', () => {
                    window.highlightConnectionsForEvent(event.id, true);
                    if (event.images && event.images.length > 1) {
                        let imgIdx = 0;
                        const imgEl = document.getElementById(`hover-img-${event.id}`);
                        window.activeHoverIntervals[event.id] = setInterval(() => {
                            imgIdx = (imgIdx + 1) % event.images.length;
                            const curImgObj = event.images[imgIdx];
                            const curSrc = typeof curImgObj === 'string' ? curImgObj : (curImgObj?.cropped || curImgObj?.original);
                            if (imgEl) imgEl.src = curSrc;
                        }, 1500);
                    }
                });

                nodeContainer.addEventListener('mouseleave', () => {
                    window.highlightConnectionsForEvent(event.id, false);
                    if (window.activeHoverIntervals[event.id]) {
                        clearInterval(window.activeHoverIntervals[event.id]);
                        delete window.activeHoverIntervals[event.id];
                    }
                });

                track.appendChild(nodeContainer);
            });

            requestAnimationFrame(() => {
                const firstDot = document.querySelector('.timeline-dot');
                const axisLine = document.getElementById('timelineMainAxis');
                const container = document.getElementById('timelineContainer');
                if (firstDot && axisLine && container) {
                    const dotRect = firstDot.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    const dotCenterY = (dotRect.top + dotRect.height / 2) - containerRect.top + container.scrollTop;
                    axisLine.style.top = `${dotCenterY}px`;
                    axisLine.style.transform = 'translateY(-50%)';
                }
                window.renderSvgConnections();
            });
        };

        window.renderSvgConnections = function() {
            const group = document.getElementById('svgConnectionsGroup');
            const container = document.getElementById('timelineContainer');
            const svgOverlay = document.getElementById('timelineSvgOverlay');
            if (!group || !container || !svgOverlay) return;

            group.innerHTML = '';

            const scrollW = container.scrollWidth;
            const scrollH = container.scrollHeight;
            svgOverlay.style.width = `${scrollW}px`;
            svgOverlay.style.height = `${scrollH}px`;

            const containerRect = container.getBoundingClientRect();

            function getQuadPointAndAngle(t, p0x, p0y, p1x, p1y, p2x, p2y) {
                const mt = 1 - t;
                const px = mt * mt * p0x + 2 * mt * t * p1x + t * t * p2x;
                const py = mt * mt * p0y + 2 * mt * t * p1y + t * t * p2y;
                const dx = 2 * mt * (p1x - p0x) + 2 * t * (p2x - p1x);
                const dy = 2 * mt * (p1y - p0y) + 2 * t * (p2y - p1y);
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                return { x: px, y: py, angle };
            }

            window.connections.forEach(conn => {
                const sourceDot = document.getElementById(`timeline-dot-${conn.sourceId}`);
                const targetDot = document.getElementById(`timeline-dot-${conn.targetId}`);

                if (!sourceDot || !targetDot) return;

                const sourceRect = sourceDot.getBoundingClientRect();
                const targetRect = targetDot.getBoundingClientRect();

                const x1 = (sourceRect.left + sourceRect.width / 2) - containerRect.left + container.scrollLeft;
                const y1 = (sourceRect.top + sourceRect.height / 2) - containerRect.top + container.scrollTop;
                const x2 = (targetRect.left + targetRect.width / 2) - containerRect.left + container.scrollLeft;
                const y2 = (targetRect.top + targetRect.height / 2) - containerRect.top + container.scrollTop;

                const distance = Math.abs(x2 - x1);
                const arcHeight = Math.min(140, Math.max(45, distance * 0.25));
                const midX = (x1 + x2) / 2;
                const midY = Math.min(y1, y2) - arcHeight;

                const pathD = `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`;

                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", `svg-conn-line conn-from-${conn.sourceId} conn-to-${conn.targetId}`);
                g.setAttribute("data-source", conn.sourceId);
                g.setAttribute("data-target", conn.targetId);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathD);
                path.setAttribute("fill", "none");
                g.appendChild(path);

                if (conn.dir === 'both') {
                    const pt1 = getQuadPointAndAngle(0.38, x1, y1, midX, midY, x2, y2);
                    const poly1 = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                    poly1.setAttribute("points", "-6,-4.5 6,0 -6,4.5");
                    poly1.setAttribute("transform", `translate(${pt1.x}, ${pt1.y}) rotate(${pt1.angle + 180})`);
                    g.appendChild(poly1);

                    const pt2 = getQuadPointAndAngle(0.62, x1, y1, midX, midY, x2, y2);
                    const poly2 = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                    poly2.setAttribute("points", "-6,-4.5 6,0 -6,4.5");
                    poly2.setAttribute("transform", `translate(${pt2.x}, ${pt2.y}) rotate(${pt2.angle})`);
                    g.appendChild(poly2);
                } else {
                    const pt = getQuadPointAndAngle(0.5, x1, y1, midX, midY, x2, y2);
                    const angle = conn.dir === 'backward' ? pt.angle + 180 : pt.angle;
                    
                    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                    poly.setAttribute("points", "-6,-4.5 6,0 -6,4.5");
                    poly.setAttribute("transform", `translate(${pt.x}, ${pt.y}) rotate(${angle})`);
                    g.appendChild(poly);
                }

                group.appendChild(g);
            });
        };

        window.highlightConnectionsForEvent = function(eventId, highlight) {

                const tId = isNaN(line.getAttribute('data-target')) ? line.getAttribute('data-target') : parseInt(line.getAttribute('data-target'));

                if (sId === eventId || tId === eventId) {
                    if (highlight) {
                        line.classList.add('active-line');

                        line.classList.remove('active-line');

                parent.className = "cursor-pointer text-xs flex items-center gap-1.5 px-2 py-1 rounded border transition-colors bg-indigo-50 border-indigo-300 text-indigo-700 font-semibold";

        window.renderModalConnections = function(eventId) {
            const listContainer = document.getElementById('eventConnList');
            const targetSelect = document.getElementById('newConnTarget');
            if (!listContainer || !targetSelect) return;

            targetSelect.innerHTML = `<option value="">选择目标事件...</option>`;
            window.events.filter(e => String(e.id) !== String(eventId)).forEach(e => {
                targetSelect.innerHTML += `<option value="${e.id}">${e.title} (${e.date})</option>`;
            });

            const currentConns = window.connections.filter(c => String(c.sourceId) === String(eventId) || String(c.targetId) === String(eventId));
            if (currentConns.length === 0) {
                listContainer.innerHTML = `<p class="text-[11px] text-slate-400 italic">暂无思维导图连线</p>`;
                return;
            }

            listContainer.innerHTML = currentConns.map(c => {
                const isSource = String(c.sourceId) === String(eventId);
                const otherId = isSource ? c.targetId : c.sourceId;
                const otherEvent = window.events.find(e => String(e.id) === String(otherId));
                let dirLabel = c.dir === 'both' ? '↔ 双向关联' : (isSource ? '➔ 指向目标' : '⬅ 被指向');

                return `
                    <div class="flex items-center justify-between bg-white px-2.5 py-1.5 rounded border border-slate-200 text-xs">
                        <span class="text-slate-700 font-medium">
                            ${dirLabel}: <strong class="text-indigo-900">${otherEvent ? otherEvent.title : '未知事件'}</strong>
                        </span>
                        <button type="button" onclick="removeConnection('${c.id}', '${eventId}')" class="text-slate-400 hover:text-rose-500 ml-2">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `;
            }).join('');

        window.addConnectionFromModal = async function(eventId) {
            const targetSelect = document.getElementById('newConnTarget');
            const targetIdRaw = targetSelect?.value;
            const targetId = isNaN(targetIdRaw) ? targetIdRaw : Number(targetIdRaw);
            const dir = document.getElementById('newConnDir')?.value || 'forward';

            if (!targetIdRaw) {
                window.showToast("请先选择关联的目标事件", "error");
                return;
            }

            const parsedEventId = isNaN(eventId) ? eventId : Number(eventId);
            const exists = window.connections.some(c => 
                (String(c.sourceId) === String(parsedEventId) && String(c.targetId) === String(targetId)) || 
                (String(c.sourceId) === String(targetId) && String(c.targetId) === String(parsedEventId))
            );
            if (exists) {
                window.showToast("节点间已存在关联", "info");
                return;
            }

            const newConn = { id: Date.now(), sourceId: parsedEventId, targetId: targetId, dir: dir };
            await window.saveConnectionToCloud(newConn);
            window.renderModalConnections(eventId);
            window.showToast("成功添加思维导图关联", "success");
        };

        window.removeConnection = async function(connId, currentEventId) {
            await window.deleteConnectionFromCloud(connId);
            window.renderModalConnections(currentEventId);
            window.showToast("已移除思维导图连线", "info");
        };

        window.handleLocalImageUpload = function(e) {
            const files = Array.from(e.target.files);
            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64 = event.target.result;
                    window.editingImageFiles.push({ original: base64, cropped: base64 });
                    window.renderMicroPreviews();
                };
                reader.readAsDataURL(f);
            });
        };

        // Crop Tool Functions
        window.openCropModal = function(index) {
            cropState.index = index;
            const imgObj = window.editingImageFiles[index];
            if (!imgObj) return;

            const modal = document.getElementById('cropModal');
            const targetImg = document.getElementById('cropTargetImg');
            const cropBox = document.getElementById('cropBox');
            if (!modal || !targetImg || !cropBox) return;

            targetImg.src = imgObj.original;
            modal.classList.remove('hidden');

            targetImg.onload = () => {
                cropState.naturalWidth = targetImg.naturalWidth;
                cropState.naturalHeight = targetImg.naturalHeight;

                const displayW = targetImg.clientWidth;
                const displayH = targetImg.clientHeight;

                // 默认截选框居中，大小为显示区域的 80%
                cropState.w = displayW * 0.8;
                cropState.h = displayH * 0.8;
                cropState.x = (displayW - cropState.w) / 2;
                cropState.y = (displayH - cropState.h) / 2;

                updateCropBoxUI();
            };

            // 绑定拖拽事件
            cropBox.onmousedown = (e) => {
                e.preventDefault();
                cropState.isDragging = true;
                cropState.startX = e.clientX - cropState.x;
                cropState.startY = e.clientY - cropState.y;
            };

            window.onmousemove = (e) => {
                if (!cropState.isDragging) return;
                const targetImg = document.getElementById('cropTargetImg');
                if (!targetImg) return;

                const displayW = targetImg.clientWidth;
                const displayH = targetImg.clientHeight;

                let nx = e.clientX - cropState.startX;
                let ny = e.clientY - cropState.startY;

                nx = Math.max(0, Math.min(displayW - cropState.w, nx));
                ny = Math.max(0, Math.min(displayH - cropState.h, ny));

                cropState.x = nx;
                cropState.y = ny;
                updateCropBoxUI();
            };

            window.onmouseup = () => {
                cropState.isDragging = false;
            };
        };

        function updateCropBoxUI() {
            const cropBox = document.getElementById('cropBox');
            if (!cropBox) return;
            cropBox.style.left = `${cropState.x}px`;
            cropBox.style.top = `${cropState.y}px`;
            cropBox.style.width = `${cropState.w}px`;
            cropBox.style.height = `${cropState.h}px`;
        }

        window.closeCropModal = function() {
            document.getElementById('cropModal')?.classList.add('hidden');
        };

        window.confirmCropImage = function() {
            const targetImg = document.getElementById('cropTargetImg');
            if (!targetImg || cropState.index < 0) return;

            const displayW = targetImg.clientWidth;
            const displayH = targetImg.clientHeight;

            const scaleX = cropState.naturalWidth / displayW;
            const scaleY = cropState.naturalHeight / displayH;

            const sx = cropState.x * scaleX;
            const sy = cropState.y * scaleY;
            const sw = cropState.w * scaleX;
            const sh = cropState.h * scaleY;

            const canvas = document.createElement('canvas');
            canvas.width = sw;
            canvas.height = sh;
            const ctx = canvas.getContext('2d');

            const imgObj = new Image();
            imgObj.src = targetImg.src;
            imgObj.onload = () => {
                ctx.drawImage(imgObj, sx, sy, sw, sh, 0, 0, sw, sh);
                const croppedBase64 = canvas.toDataURL('image/jpeg', 0.9);

                window.editingImageFiles[cropState.index].cropped = croppedBase64;
                window.renderMicroPreviews();
                window.closeCropModal();
                window.showToast("图片区域截选成功", "success");
            };
        };

        window.saveEvent = async function(e, idRaw, isEdit) {
            e.preventDefault();
            const id = isNaN(idRaw) ? idRaw : Number(idRaw);
            const title = document.getElementById('editTitle')?.value.trim();
            const date = document.getElementById('editDate')?.value;
            const type = document.getElementById('editType')?.value;
            const description = document.getElementById('editDescription')?.value.trim();

            const selectedTags = Array.from(document.querySelectorAll('#editTagsList input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            if (!title || !date) {
                window.showToast("请填写必填项", "error");
                return;
            }

            const eventData = {
                id: id,
                title: title,
                date: date,
                type: type,
                description: description,
                tags: selectedTags,
                images: [...window.editingImageFiles]
            };

            await window.saveEventToCloud(eventData);
            window.closeEditModal();
            window.showToast(isEdit ? "事件修改已保存" : "新建事件成功", "success");
        };

        window.showToast = function(text, type = "info") {
            const toastBox = document.getElementById('toastBox');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');

            if (!toastBox || !toastText || !toastIcon) return;

            toastText.innerText = text;
            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-indigo-400 text-lg";
            }

            toastBox.classList.remove('hidden');
            setTimeout(() => {
                toastBox.classList.add('hidden');
            }, 3000);
        };

        window.onresize = () => window.renderSvgConnections();
        window.onload = () => initAppAndCloudSync();
    </script>
</body>
</html>
